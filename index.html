<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143b3b"><meta name="description" content="旋轉齒輪、串起動力，帶領四位發條守衛守住十二波夜霧。原創策略塔防小遊戲。"><title>發條森衛 · Clockwork Wardens</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<main class="game"><header><div class="brand"><span class="sigil">✺</span><div><h1>發條森衛</h1><small>CLOCKWORK WARDENS</small></div></div><nav><button id="help" aria-label="遊戲說明">?</button><button id="settings" aria-label="設定">⚙</button><button id="pause" aria-label="暫停">Ⅱ</button></nav></header>
<div class="status"><span id="wave">第 1 / 12 波</span><span id="power">動力 2 / 2</span><span class="coins">◈ <b id="coins">100</b></span></div>
<section class="battle" aria-label="怪物進攻區"><canvas id="battle" width="600" height="330"></canvas><div class="chapter"><span id="chapter">01 · 苔光入口</span><small id="weather">工坊準備中</small></div><div id="banner" class="banner">把齒輪接上金色核心，讓森林醒來。</div><div class="wall"><span>森之城牆</span><div><i id="healthbar"></i></div><b id="hp">100</b></div></section>
<section class="workshop"><div class="board-heading"><div><span class="eyebrow">THE WINDING ROOM</span><h2>齒輪工坊</h2></div><span id="phase">整備回合</span></div><div class="board-wrap"><svg id="board" viewBox="0 0 600 500" role="img" aria-label="6 欄 5 列齒輪盤，選擇商店守衛後點格子放置"></svg><div id="toast" role="status" aria-live="polite"></div></div><p id="hint">先選守衛，再點空格。相鄰齒輪會傳遞動力。</p>
<div class="tools"><button id="rotate">↻ 旋轉 <kbd>R</kbd></button><button id="upgrade">↑ 強化</button><button id="sell">回收</button><button id="cancel">取消</button></div><div class="shop" id="shop"></div><div class="selected-info" id="info">兩格一組，旋轉可改變佔位。暗色守衛沒有接上核心。</div><div class="bottom"><button id="repair">修牆 +25 · ◈25</button><button class="primary" id="start">開始第 1 波 <span>→</span></button></div><div class="footer"><span id="best">最高紀錄 0 / 12</span><span>拖曳移動 · 點選也可以</span></div></section></main>
<aside class="desktop-note"><div class="note-mark">✺</div><h2>小齒輪，<br>大守護。</h2><p>接上動力。<br>排好隊形。<br>把夜霧擋在森林之外。</p><div class="note-line"></div><small>原創工坊策略遊戲<br>12 波夜霧 · 4 位森衛</small></aside>
<dialog id="modal"><div id="modal-content"></div></dialog><script type="module" src="app.js"></script></body></html>
